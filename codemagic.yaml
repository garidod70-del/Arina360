workflows:
  arena360-android:
    name: ARENA 360 Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Prepare Android platform
        script: |
          cd "$CM_BUILD_DIR/apps/mobile"
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name arena360 .
          fi
      - name: Install Flutter dependencies
        script: |
          cd "$CM_BUILD_DIR/apps/mobile"
          flutter pub get
      - name: Build installable Android APK
        script: |
          cd "$CM_BUILD_DIR/apps/mobile"
          flutter build apk --debug
    artifacts:
      - apps/mobile/build/app/outputs/flutter-apk/*.apk
      - apps/mobile/build/**/outputs/**/*.apk
