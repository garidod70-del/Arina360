databases:
  - name: arena360-postgres
    databaseName: arena360
    user: arena360
    plan: free

services:
  - type: web
    name: arena360-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: arena360-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_KEY
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: QPAY_BASE_URL
        value: https://merchant.qpay.mn
      - key: QPAY_CLIENT_ID
        sync: false
      - key: QPAY_CLIENT_SECRET
        sync: false
      - key: QPAY_INVOICE_CODE
        sync: false
      - key: QPAY_CALLBACK_URL
        sync: false
