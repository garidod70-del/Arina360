services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arena360
      POSTGRES_USER: arena360
      POSTGRES_PASSWORD: change-this-local-password
    volumes:
      - arena360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena360 -d arena360"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://arena360:change-this-local-password@db:5432/arena360
      JWT_SECRET: local-development-secret-change-before-deploy-123456
      AUTO_CREATE_TABLES: "true"
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  arena360_pgdata:
