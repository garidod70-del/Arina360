name: ARENA 360 Platform Foundation CI
on:
  push:
    branches: [main, arena360-platform-foundation]
    paths:
      - 'backend/**'
      - 'web/admin/**'
      - '.github/workflows/platform-foundation-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'web/admin/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/ARENA360.Api/ARENA360.Api.csproj
      - name: Build
        run: dotnet build backend/ARENA360.Api/ARENA360.Api.csproj --configuration Release --no-restore
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/admin/package.json
      - run: npm install
      - run: npm run build
