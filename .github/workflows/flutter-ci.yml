name: Flutter CI

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run widget and unit tests
        working-directory: apps/mobile
        run: flutter test
