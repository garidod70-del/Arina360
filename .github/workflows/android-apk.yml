name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Generate Android project
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name arena360 --org mn.arena360 .
      - name: Build clean ARM64 release APK
        working-directory: apps/mobile
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --target-platform android-arm64
      - name: Verify APK signature and package
        working-directory: apps/mobile
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -t "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: ARENA360-S21-ANDROID14-APK
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
