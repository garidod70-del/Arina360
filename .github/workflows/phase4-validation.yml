name: ARENA 360 Phase 4 ecosystem validation

on:
  push:
    branches:
      - feature/arena360-phase4-ecosystem
    paths:
      - "backend/**"
      - "apps/mobile/**"
      - ".github/workflows/phase4-validation.yml"
  pull_request:
    paths:
      - "backend/**"
      - "apps/mobile/**"
      - ".github/workflows/phase4-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate all database migrations
        run: PYTHONPATH=. alembic upgrade head
      - name: Run complete backend test suite
        run: PYTHONPATH=. pytest -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          cache: true
      - name: Generate Android platform
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name arena360 --org mn.arena360 .
      - name: Add Internet permission
        working-directory: apps/mobile
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze all Flutter source and tests
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter widget tests
        working-directory: apps/mobile
        run: flutter test
      - name: Build x86_64 debug APK for emulator
        working-directory: apps/mobile
        run: flutter build apk --debug --target-platform android-x64
      - name: Install and launch on Android 14 emulator
        continue-on-error: true
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -n mn.arena360.arena360/.MainActivity
            sleep 5
            test -n "$(adb shell pidof mn.arena360.arena360)"
            if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then
              echo "Android app crashed during emulator launch."
              exit 1
            fi
      - name: Build ARM64 release APK
        working-directory: apps/mobile
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ARENA360-PHASE4-ANDROID-APK
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
