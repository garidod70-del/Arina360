name: ARENA 360 Phase 3 validation

on:
  push:
    branches:
      - feature/arena360-tournament-module
      - feature/arena360-quality-hardening
    paths:
      - "backend/**"
      - "apps/mobile/**"
      - ".github/workflows/phase3-validation.yml"
  pull_request:
    paths:
      - "backend/**"
      - "apps/mobile/**"
      - ".github/workflows/phase3-validation.yml"
  workflow_dispatch:

concurrency:
  group: arena360-phase3-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate database migrations
        run: PYTHONPATH=. alembic upgrade head
      - name: Run backend tests
        run: PYTHONPATH=. pytest -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          cache: true
      - name: Generate Android platform
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name arena360 --org mn.arena360 .
      - name: Add Internet permission
        working-directory: apps/mobile
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: apps/mobile
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Build ARM64 release APK
        working-directory: apps/mobile
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ARENA360-PHASE3-ANDROID-APK
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
